<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de matrícula | CDHM</title>

    <!--Link to CSS file-->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img class="cdhm-icon" src="./assets/images/SVG/Ícone CDHM.svg">

            <div class="headings">
                <h1 class="heading-1">
                    CDHM
                </h1>

                <h2 class="heading-2">
                    Centro de Desenvolvimento Humano Musical
                </h2>

                <h3 class="heading-3">
                    Formulário de Matrícula
                </h3>
            </div>
        </div>
    </header>






































    <main class="main-content">

        <!--Formulary-->
        <form class="formulary" action="#" method="#" target="_blank" autocomplete="off">

            <div class="students-data">

                <span class="students-data-title">Dados do aluno</span>

                <!-- PERSONAL DATA -->
                <fieldset class="personal-data">
                    <!--Título do campo-->
                    <legend class="legenda-1">Dados pessoais</legend>

                    <!--Full name-->
                    <div class="full-name">
                        <label for="full-name">Nome completo</label>
                        <input type="text" id="full-name" name="full-name" placeholder="ex: João da Silva">
                    </div>

                    <!--Birth date-->
                    <div class="birth-date">
                        <label for="birth-date">Data de nascimento</label>
                        <input type="date" id="birth-date" name="birth-date">
                    </div>

                    <!--CPF-->
                    <div class="cpf">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                    </div>

                    <div class="rg">
                        <label for="rg">RG</label>
                        <input type="text" id="rg" name="rg" placeholder="00.000.000-0">
                    </div>

                    <div class="sex">
                        <!-- Visual id -->
                        <span class="title">Sexo</span>

                        <div class="sex-option">
                            <div class="male">
                                <input type="radio" id="male" name="sex" value="male">
                                <label for="male">Masculino</label>
                            </div>

                            <div class="female">
                                <input type="radio" id="female" name="sex" value="female">
                                <label for="female">Feminino</label>
                            </div>
                        </div>
                    </div>

                    <div class="nationality">
                        <label for="nationality">Nacionalidade</label>
                        <input type="text" id="nationality" name="nationality" placeholder="ex: Brasileiro(a)">
                    </div>

                    <div class="naturality">
                        <span>Naturalidade</span>
                        <div class="naturality-content">
                            <!-- <label for="city">Cidade</label> -->
                            <select id="uf" name="uf">
                                <option value="" selected disabled>UF</option>
                                <option value="AC">AC</option>
                                <option value="AL">AL</option>
                                <option value="AP">AP</option>
                                <option value="AM">AM</option>
                                <option value="BA">BA</option>
                                <option value="CE">CE</option>
                                <option value="DF">DF</option>
                                <option value="ES">ES</option>
                                <option value="GO">GO</option>
                                <option value="MA">MA</option>
                                <option value="MT">MT</option>
                                <option value="MS">MS</option>
                                <option value="MG">MG</option>
                                <option value="PA">PA</option>
                                <option value="PB">PB</option>
                                <option value="PR">PR</option>
                                <option value="PE">PE</option>
                                <option value="PI">PI</option>
                                <option value="RJ">RJ</option>
                                <option value="RN">RN</option>
                                <option value="RS">RS</option>
                                <option value="RO">RO</option>
                                <option value="RR">RR</option>
                                <option value="SC">SC</option>
                                <option value="SP">SP</option>
                                <option value="SE">SE</option>
                                <option value="TO">TO</option>
                                <option value="EX">EX</option>
                            </select>

                            <select id="city" name="city">
                                <option value="" selected disabled>Cidade</option>
                                <option value="Cidade-A">Cidade-A</option>
                                <option value="Cidade-B">Cidade-B</option>
                                <option value="Cidade-C">Cidade-C</option>
                                <option value="Cidade-D">Cidade-D</option>
                                <option value="Cidade-E">Cidade-E</option>
                                <option value="Cidade-F">Cidade-F</option>
                                <option value="Cidade-G">Cidade-G</option>
                                <option value="Cidade-H">Cidade-H</option>
                                <option value="Cidade-I">Cidade-I</option>
                                <option value="Cidade-J">Cidade-J</option>
                                <option value="Cidade-K">Cidade-K</option>
                                <option value="Cidade-L">Cidade-L</option>
                                <option value="Cidade-M">Cidade-M</option>
                                <option value="Cidade-N">Cidade-N</option>
                                <option value="Cidade-O">Cidade-O</option>
                                <option value="Cidade-P">Cidade-P</option>
                                <option value="Cidade-Q">Cidade-Q</option>
                                <option value="Cidade-R">Cidade-R</option>
                                <option value="Cidade-S">Cidade-S</option>
                                <option value="Cidade-T">Cidade-T</option>
                                <option value="Cidade-U">Cidade-U</option>
                                <option value="Cidade-V">Cidade-V</option>
                                <option value="Cidade-W">Cidade-W</option>
                                <option value="Cidade-X">Cidade-X</option>
                                <option value="Cidade-Y">Cidade-Y</option>
                                <option value="Cidade-Z">Cidade-Z</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <!-- ADRESS -->
                <fieldset class="adress categoria">
                    <!--Título do campo-->
                    <legend class="legenda-3">Endereço</legend>

                    <div class="dupla-a duplas">
                        <!--Entrada - CEP-->
                        <p class="cep">
                            <label for="cep">CEP</label>
                            <input type="" id="cep" name="cep" placeholder="00000-000">
                        </p>

                        <!--Entrada - Número da casa-->
                        <p class="numero">
                            <label for="numero">Número</label>
                            <input type="text" id="numero" name="numero" placeholder="0000">
                        </p>
                    </div>

                    <div class="dupla-b duplas">
                        <!--Entrada - Nome da rua-->
                        <p class="rua">
                            <label for="rua">Rua</label>
                            <input type="text" id="rua" name="rua" placeholder="Rua exemplo">
                        </p>

                        <!--Entrada - Nome da rua-->
                        <p class="bairro">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" name="bairro" placeholder="Bairro exemplo">
                        </p>
                    </div>

                    <div class="dupla-c duplas">
                        <!--Entrada - Nome da cidade-->
                        <p class="cidade">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Cidade exemplo">
                        </p>

                        <!--Entrada - Estado-->
                        <p class="estado">
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" name="estado" placeholder="EE">
                        </p>
                    </div>

                    <!--Entrada - Complemento-->
                    <div class="complemento">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Complemento exemplo">
                    </div>
                </fieldset>

                <!-- CONTACT -->
                <fieldset class="contact">
                    <!--Título do campo-->
                    <legend class="contacts-legend">Contato</legend>

                    <!--Entrada do telefone-->
                    <div class="telefone">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                    </div>

                    <!--Entrada do E-mail-->
                    <div class="email">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com">
                    </div>
                </fieldset>

                <fieldset class="health-info">
                    <legend class="legenda-4">Informações de saúde</legend>

                    <div class="pcd-yn">
                        <span class="pcd-title">O aluno(a) é PCD?</span>

                        <div class="pcd-options">
                            <div class="option-yes option">
                                <input type="radio" id="input-yes" name="pcd-option" value="yes">
                                <label for="input-yes">Sim</label>
                            </div>

                            <div class="option-no option">
                                <input type="radio" id="input-no" name="pcd-option" value="no">
                                <label for="input-no">Não</label>
                            </div>
                        </div>


                        <input type="text" id="disa-name" name="disa-name" placeholder="Informe o nome da deficiência">


                        <div class="medical-report">
                            <span for="mr-file">Anexe o laudo abaixo</span>
                            <input type="file" id="mr-file" name="mr-file">
                        </div>
                    </div>
                </fieldset>
            </div>























































































































            <!-- Botão "CONTINUAR" Leva à página de pagamento
            <p class="botao-enviar">
                <button type="submit" id="verdadeiro-botao-enviar">ENVIAR</button>
                "CONTINUAR" para fins didáticos e pedagógicos. Observe o "type" do botão.
            </p> -->
        </form>
    </main>
















    <!-- Rodapé
    <footer class="rodape">
        Texto informativo do rodapé
        <p clss="xxi-confader">XII CONFADER</p>
        <p class="iead">Igreja Evangélica Assembléia de Deus</p>
        <p class="pvh">Porto Velho/RO</p>
    </footer> -->
</body>


</html>
